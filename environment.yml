name: cutoff
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy
  - scipy
  - pyyaml
  - pydantic>=2.6
  - gdal>=3.8
  - rasterio>=1.3.9
  - pyproj
  - geopandas>=1.0
  - shapely>=2
  - pyogrio
  - pyarrow>=26
  - networkx>=3.2
  - requests
  - httpx
  - pystac-client
  - pyflwdir>=0.5.8
  - jinja2
  - psutil
  - weasyprint          # Linux/macOS; on Windows use xhtml2pdf fallback (P4)
  - streamlit
  - folium
  - matplotlib
  - pytest
  - pip
  - pip:
      - streamlit-folium
      - xhtml2pdf
      - pypdf
      - -e .
# ML (torch, segmentation-models-pytorch, huggingface_hub) is installed separately:
#   CPU laptop:  pip install -e ".[ml]"
#   Colab/Kaggle: see notebooks/colab_train.ipynb (P2)
