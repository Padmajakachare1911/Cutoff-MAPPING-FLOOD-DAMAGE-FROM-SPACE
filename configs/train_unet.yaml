# U-Net training on the Kuro Siwo subset (P2.4). Data: $CUTOFF_DATA_DIR/kuro ; runs: $CUTOFF_DATA_DIR/runs/<name>
#   python -m cutoff.ml.train --name p7            (main model)
#   python -m cutoff.ml.train --name b2_post_only  (E3 / H1)
#   python -m cutoff.ml.train --name b3_no_slope   (E3 / D6)
# Values are starting points chosen BEFORE seeing any result (not tuned on test events or Trishuli).
base:
  encoder: resnet34
  pretrained: true          # ImageNet init; smp adapts the first conv to 7 channels
  epochs: 30
  batch_size: 16            # RTX 4050 6 GB with AMP; drop to 8 if CUDA OOM
  lr: 3.0e-4
  weight_decay: 1.0e-4
  patience: 6               # early stop on validation-event flood IoU
  num_workers: 4
  seed: 42
  class_weights: [1.0, 1.0, 3.0]
  flips: false              # geometric flips mirror look geometry; ablation only
  zero_channels: []         # channels held at their training mean (ablations)
  max_stat_samples: 2000
variants:
  p7: {zero_channels: []}                         # 7 channels: pre, post, diff, slope (clipped 0-15 deg)
  b3_no_slope: {zero_channels: [6]}               # D6 ablation: no slope
  b2_post_only: {zero_channels: [0, 1, 4, 5, 6]}  # H1: post VV/VH only
  p7_flips: {flips: true}                         # E3 ablation
  p7_seed7: {seed: 7}
