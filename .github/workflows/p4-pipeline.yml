name: P4 pipeline
on:
  pull_request:
    paths: ["src/cutoff/pipeline.py", "src/cutoff/cli.py", "tests/test_p4_pipeline.py", ".github/workflows/**", "pyproject.toml"]
  push:
    branches: [main, "p4/**"]
    paths: ["src/cutoff/pipeline.py", "src/cutoff/cli.py", "tests/test_p4_pipeline.py", ".github/workflows/**", "pyproject.toml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    uses: ./.github/workflows/p4-checks.yml
    with:
      tests: "tests/test_p4_pipeline.py"

