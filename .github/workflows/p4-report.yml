name: P4 report
on:
  pull_request:
    paths: ["src/cutoff/report/**", "tests/test_p4_sitrep.py", ".github/workflows/**", "pyproject.toml"]
  push:
    branches: [main, "p4/**"]
    paths: ["src/cutoff/report/**", "tests/test_p4_sitrep.py", ".github/workflows/**", "pyproject.toml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    uses: ./.github/workflows/p4-checks.yml
    with:
      tests: "tests/test_p4_sitrep.py"

