name: P4 runtime
on:
  pull_request:
    paths: ["eval/runtime.py", "tests/test_p4_runtime.py", ".github/workflows/**"]
  push:
    branches: [main, "p4/**"]
    paths: ["eval/runtime.py", "tests/test_p4_runtime.py", ".github/workflows/**"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    uses: ./.github/workflows/p4-checks.yml
    with:
      tests: "tests/test_p4_runtime.py"
